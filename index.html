<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<title>친구채팅</title>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    font-family: Arial, "Noto Sans KR", sans-serif;
    background: #e8e8e8;
    color: #222;
}

.app {
    width: 100%;
    max-width: 600px;
    height: 100vh;
    margin: auto;
    background: #b2dff7;
    display: flex;
    flex-direction: column;
}

/* 상단 */
.header {
    height: 58px;
    background: white;
    display: flex;
    align-items: center;
    padding: 0 16px;
    border-bottom: 1px solid #ddd;
    flex-shrink: 0;
}

.header-title {
    font-size: 20px;
    font-weight: bold;
    flex: 1;
}

.header button {
    border: none;
    background: #f1f1f1;
    border-radius: 50%;
    width: 38px;
    height: 38px;
    font-size: 18px;
    cursor: pointer;
}

/* 채팅 */
.chat {
    flex: 1;
    overflow-y: auto;
    padding: 18px 12px 12px;
}

.date {
    text-align: center;
    margin: 5px 0 18px;
}

.date span {
    display: inline-block;
    background: rgba(255,255,255,0.75);
    padding: 6px 13px;
    border-radius: 20px;
    font-size: 12px;
    color: #555;
}

/* 메시지 */
.message {
    display: flex;
    margin-bottom: 10px;
    align-items: flex-end;
}

.message.me {
    justify-content: flex-end;
}

.profile {
    width: 36px;
    height: 36px;
    background: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-right: 8px;
    font-size: 18px;
    flex-shrink: 0;
}

.message-content {
    max-width: 75%;
}

.name {
    font-size: 12px;
    margin-bottom: 4px;
    color: #555;
}

.bubble {
    display: inline-block;
    padding: 9px 12px;
    border-radius: 13px;
    background: white;
    font-size: 15px;
    line-height: 1.4;
    word-break: break-word;
}

.me .bubble {
    background: #ffe94a;
    border-radius: 13px 13px 3px 13px;
}

.message:not(.me) .bubble {
    border-radius: 13px 13px 13px 3px;
}

.time {
    font-size: 10px;
    color: #666;
    margin: 0 5px;
    white-space: nowrap;
}

/* 입력 */
.input-area {
    min-height: 62px;
    background: white;
    border-top: 1px solid #ddd;
    display: flex;
    align-items: center;
    padding: 8px;
    gap: 7px;
    flex-shrink: 0;
}

.plus {
    width: 40px;
    height: 40px;
    border: none;
    background: #f2f2f2;
    border-radius: 10px;
    font-size: 23px;
}

.input {
    flex: 1;
    height: 42px;
    border: 1px solid #ddd;
    border-radius: 21px;
    padding: 0 15px;
    outline: none;
    font-size: 15px;
}

.input:focus {
    border-color: #aaa;
}

.send {
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 50%;
    background: #ffe94a;
    font-size: 19px;
    cursor: pointer;
}

.send:active {
    transform: scale(0.92);
}

/* 닉네임 창 */
.modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal {
    width: 100%;
    max-width: 360px;
    background: white;
    border-radius: 20px;
    padding: 24px;
}

.modal h2 {
    margin: 0 0 8px;
}

.modal p {
    color: #777;
    font-size: 14px;
}

.modal input {
    width: 100%;
    height: 45px;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 0 12px;
    font-size: 15px;
    outline: none;
}

.modal-actions {
    display: flex;
    gap: 8px;
    margin-top: 15px;
}

.modal-actions button {
    flex: 1;
    height: 43px;
    border: none;
    border-radius: 10px;
    font-weight: bold;
}

.cancel {
    background: #eee;
}

.save {
    background: #ffe94a;
}

.status {
    font-size: 11px;
    color: #777;
    margin-left: 8px;
}

@media (min-width: 601px) {
    .app {
        box-shadow: 0 0 25px rgba(0,0,0,0.12);
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <div class="header-title">
            💬 친구채팅
            <span class="status" id="status">연결 중...</span>
        </div>

        <button onclick="openNickname()">⚙️</button>
    </div>

    <div class="chat" id="chat">

        <div class="date">
            <span>친구채팅</span>
        </div>

    </div>

    <div class="input-area">

        <button class="plus" onclick="plusMessage()">＋</button>

        <input
            id="messageInput"
            class="input"
            type="text"
            placeholder="메시지를 입력하세요"
            autocomplete="off"
        >

        <button class="send" onclick="sendMessage()">➤</button>

    </div>

</div>


<!-- 닉네임 -->
<div class="modal-bg" id="nicknameModal">

    <div class="modal">

        <h2>내 닉네임</h2>

        <p>친구들에게 표시될 이름을 입력하세요.</p>

        <input
            id="nicknameInput"
            type="text"
            maxlength="20"
            placeholder="닉네임"
        >

        <div class="modal-actions">

            <button class="cancel" onclick="closeNickname()">
                취소
            </button>

            <button class="save" onclick="saveNickname()">
                저장
            </button>

        </div>

    </div>

</div>


<script>

/* ==========================================
   SUPABASE 설정
========================================== */

const SUPABASE_URL =
    "https://qtprsnwbeqwuzqpnlxot.supabase.co";

const SUPABASE_ANON_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF0cHJzbndiZXF3dXpxcG5seG90Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNTIwNjksImV4cCI6MjEwMzkyODA2OX0.O39oJfWYgvI2O40EcI4cgw3yM1HNrvz0n--CXiKMThM";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* ==========================================
   기본 설정
========================================== */

let nickname =
    localStorage.getItem("nickname") || "나";

const chat =
    document.getElementById("chat");

const input =
    document.getElementById("messageInput");

const status =
    document.getElementById("status");


/* ==========================================
   시간
========================================== */

function formatTime(dateString) {

    const date = new Date(dateString);

    return date.toLocaleTimeString("ko-KR", {
        hour: "numeric",
        minute: "2-digit"
    });

}


/* ==========================================
   메시지 화면에 표시
========================================== */

function addMessage(data) {

    const message =
        document.createElement("div");

    const isMe =
        data.nickname === nickname;

    message.className =
        "message" + (isMe ? " me" : "");


    if (isMe) {

        message.innerHTML = `
            <div class="time">
                ${formatTime(data.created_at)}
            </div>

            <span class="bubble"></span>
        `;

        message.querySelector(".bubble")
            .textContent = data.message;

    } else {

        message.innerHTML = `
            <div class="profile">👤</div>

            <div class="message-content">

                <div class="name">
                    ${escapeHTML(data.nickname)}
                </div>

                <span class="bubble"></span>

            </div>

            <div class="time">
                ${formatTime(data.created_at)}
            </div>
        `;

        message.querySelector(".bubble")
            .textContent = data.message;

    }

    chat.appendChild(message);

    chat.scrollTop =
        chat.scrollHeight;
}


/* ==========================================
   HTML 안전 처리
========================================== */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


/* ==========================================
   기존 메시지 불러오기
========================================== */

async function loadMessages() {

    const { data, error } =
        await supabaseClient
            .from("messages")
            .select("*")
            .order("created_at", {
                ascending: true
            });

    if (error) {

        console.error(error);

        status.textContent =
            "연결 오류";

        return;
    }

    status.textContent =
        "● 온라인";

    data.forEach(addMessage);

}


/* ==========================================
   메시지 보내기
========================================== */

async function sendMessage() {

    const text =
        input.value.trim();

    if (!text) return;


    input.disabled = true;


    const { error } =
        await supabaseClient
            .from("messages")
            .insert({
                nickname: nickname,
                message: text
            });


    if (error) {

        console.error(error);

        alert(
            "메시지를 보내지 못했습니다.\n\n" +
            error.message
        );

    } else {

        input.value = "";

    }


    input.disabled = false;

    input.focus();

}


/* ==========================================
   실시간 메시지
========================================== */

supabaseClient
    .channel("messages-realtime")
    .on(
        "postgres_changes",
        {
            event: "INSERT",
            schema: "public",
            table: "messages"
        },
        function(payload) {

            addMessage(payload.new);

        }
    )
    .subscribe(function(state) {

        console.log(
            "Realtime 상태:",
            state
        );

        if (state === "SUBSCRIBED") {

            status.textContent =
                "● 온라인";

        }

    });


/* ==========================================
   엔터키
========================================== */

input.addEventListener(
    "keydown",
    function(e) {

        if (e.key === "Enter") {

            sendMessage();

        }

    }
);


/* ==========================================
   닉네임
========================================== */

function openNickname() {

    document
        .getElementById("nicknameModal")
        .style.display = "flex";

    document
        .getElementById("nicknameInput")
        .value = nickname;

    setTimeout(function() {

        document
            .getElementById("nicknameInput")
            .focus();

    }, 100);

}


function closeNickname() {

    document
        .getElementById("nicknameModal")
        .style.display = "none";

}


function saveNickname() {

    const value =
        document
            .getElementById("nicknameInput")
            .value
            .trim();

    if (!value) {

        alert("닉네임을 입력하세요.");

        return;

    }

    nickname = value;

    localStorage.setItem(
        "nickname",
        nickname
    );

    closeNickname();

    alert(
        "닉네임이 '" +
        nickname +
        "'으로 변경됐어요!"
    );

}


/* ==========================================
   + 버튼
========================================== */

function plusMessage() {

    alert(
        "사진 / 파일 기능은 다음 단계에서 추가하자!"
    );

}


/* ==========================================
   시작
========================================== */

loadMessages();

</script>

</body>
</html>
