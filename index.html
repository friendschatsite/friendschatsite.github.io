<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>FriendsChat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fa;
    color: #222;
}

/* 로그인 */

#loginScreen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px;
    background: linear-gradient(135deg, #eaffd0, #ffffff);
}

.login-box {
    width: 100%;
    max-width: 380px;
    background: white;
    border-radius: 24px;
    padding: 35px 25px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.1);
}

.logo {
    text-align: center;
    font-size: 32px;
    font-weight: 800;
    color: #72b82a;
    margin-bottom: 8px;
}

.login-subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 30px;
}

.login-box input {
    width: 100%;
    height: 52px;
    border: 1px solid #ddd;
    border-radius: 13px;
    padding: 0 15px;
    font-size: 16px;
    margin-bottom: 12px;
    outline: none;
}

.login-box input:focus {
    border-color: #8fd14f;
}

.login-btn {
    width: 100%;
    height: 52px;
    border: none;
    border-radius: 13px;
    background: #8fd14f;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.login-btn:active {
    transform: scale(0.98);
}

.login-error {
    color: #e74c3c;
    text-align: center;
    min-height: 22px;
    margin: 10px 0;
}

/* 채팅 */

#chatScreen {
    display: none;
    height: 100vh;
    height: 100dvh;
    flex-direction: column;
    background: #f7f8fa;
}

.header {
    height: 64px;
    flex-shrink: 0;
    background: white;
    border-bottom: 1px solid #eee;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
}

.header-left {
    display: flex;
    align-items: center;
    gap: 10px;
}

.header-title {
    font-size: 20px;
    font-weight: bold;
}

.online-dot {
    width: 9px;
    height: 9px;
    background: #6ed34a;
    border-radius: 50%;
}

.header-user {
    font-size: 14px;
    color: #777;
}

.logout-btn {
    border: none;
    background: #f1f3f5;
    border-radius: 10px;
    padding: 8px 11px;
    cursor: pointer;
}

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 18px 14px;
}

.message-row {
    display: flex;
    flex-direction: column;
    margin-bottom: 13px;
}

.message-row.mine {
    align-items: flex-end;
}

.message-row.other {
    align-items: flex-start;
}

.nickname {
    font-size: 12px;
    color: #777;
    margin: 0 7px 4px;
}

.message-line {
    display: flex;
    align-items: flex-end;
    gap: 5px;
    max-width: 85%;
}

.mine .message-line {
    flex-direction: row-reverse;
}

.bubble {
    padding: 10px 13px;
    border-radius: 17px;
    background: white;
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    word-break: break-word;
    font-size: 15px;
    line-height: 1.4;
}

.mine .bubble {
    background: #dff7b8;
}

.message-info {
    font-size: 10px;
    color: #999;
    white-space: nowrap;
}

.input-area {
    flex-shrink: 0;
    background: white;
    border-top: 1px solid #eee;
    padding: 10px;
    display: flex;
    gap: 8px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
}

.message-input {
    flex: 1;
    height: 45px;
    border: 1px solid #ddd;
    border-radius: 23px;
    padding: 0 16px;
    font-size: 15px;
    outline: none;
}

.send-btn {
    width: 45px;
    height: 45px;
    border: none;
    border-radius: 50%;
    background: #8fd14f;
    color: white;
    font-size: 20px;
    font-weight: bold;
}

.empty {
    text-align: center;
    color: #aaa;
    margin-top: 40px;
}
</style>
</head>

<body>

<!-- 로그인 화면 -->
<div id="loginScreen">
    <div class="login-box">

        <div class="logo">FriendsChat</div>
        <div class="login-subtitle">친구들과 함께하는 채팅</div>

        <input
            id="username"
            type="text"
            placeholder="아이디"
            autocomplete="off"
        >

        <input
            id="password"
            type="password"
            placeholder="비밀번호"
            autocomplete="off"
        >

        <div id="loginError" class="login-error"></div>

        <button class="login-btn" onclick="login()">
            로그인
        </button>

    </div>
</div>


<!-- 채팅 화면 -->
<div id="chatScreen">

    <div class="header">

        <div class="header-left">
            <div class="online-dot"></div>
            <div class="header-title">FriendsChat</div>
        </div>

        <div class="header-user">
            <span id="currentUser"></span>
            <button class="logout-btn" onclick="logout()">로그아웃</button>
        </div>

    </div>

    <div id="messages" class="messages">
        <div class="empty">메시지를 불러오는 중...</div>
    </div>

    <div class="input-area">

        <input
            id="messageInput"
            class="message-input"
            type="text"
            placeholder="메시지를 입력하세요"
            autocomplete="off"
        >

        <button class="send-btn" onclick="sendMessage()">➤</button>

    </div>

</div>


<script>
const SUPABASE_URL =
    "https://qtprsnwbeqwuzqpnlxot.supabase.co";

const SUPABASE_ANON_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF0cHJzbndiZXE3dXpxcG5seG90Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1MjIwNjksImV4cCI6MjEwMzkyODA2OX0.O39oJfWYgvI2O40EcI4cgw3yM1HNrvz0n--CXiKMThM";

const supabaseClient =
    supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = localStorage.getItem("friendschat_user");


/* 로그인 상태 확인 */

if (currentUser) {
    showChat();
}


/* 로그인 */

async function login() {

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    const error =
        document.getElementById("loginError");

    error.textContent = "";

    if (!username || !password) {
        error.textContent = "아이디와 비밀번호를 입력하세요.";
        return;
    }

    const { data, error: dbError } =
        await supabaseClient
            .from("chat_users")
            .select("username")
            .eq("username", username)
            .eq("password", password)
            .maybeSingle();

    if (dbError) {
        console.error(dbError);
        error.textContent = "로그인 오류가 발생했습니다.";
        return;
    }

    if (!data) {
        error.textContent = "아이디 또는 비밀번호가 틀렸습니다.";
        return;
    }

    currentUser = data.username;

    localStorage.setItem(
        "friendschat_user",
        currentUser
    );

    showChat();
}


/* 채팅 화면 */

function showChat() {

    document.getElementById("loginScreen").style.display = "none";

    document.getElementById("chatScreen").style.display = "flex";

    document.getElementById("currentUser").textContent =
        currentUser;

    loadMessages();

    subscribeMessages();

    document.getElementById("messageInput").focus();
}


/* 로그아웃 */

function logout() {

    localStorage.removeItem("friendschat_user");

    currentUser = null;

    location.reload();
}


/* 메시지 불러오기 */

async function loadMessages() {

    const box =
        document.getElementById("messages");

    const { data, error } =
        await supabaseClient
            .from("messages")
            .select("*")
            .order("id", { ascending: true });

    if (error) {
        console.error(error);
        box.innerHTML =
            '<div class="empty">메시지를 불러오지 못했습니다.</div>';
        return;
    }

    box.innerHTML = "";

    if (!data || data.length === 0) {

        box.innerHTML =
            '<div class="empty">아직 메시지가 없습니다.</div>';

        return;
    }

    data.forEach(addMessage);

    scrollToBottom();
}


/* 메시지 표시 */

function addMessage(message) {

    const box =
        document.getElementById("messages");

    const row =
        document.createElement("div");

    const mine =
        message.nickname === currentUser;

    row.className =
        "message-row " +
        (mine ? "mine" : "other");

    const nickname =
        document.createElement("div");

    nickname.className = "nickname";

    nickname.textContent =
        mine ? "" : message.nickname;

    const line =
        document.createElement("div");

    line.className = "message-line";

    const bubble =
        document.createElement("div");

    bubble.className = "bubble";

    bubble.textContent =
        message.message;

    const info =
        document.createElement("div");

    info.className = "message-info";

    const time =
        message.created_at
            ? new Date(message.created_at)
                .toLocaleTimeString("ko-KR", {
                    hour: "2-digit",
                    minute: "2-digit"
                })
            : "";

    info.textContent = time;

    line.appendChild(bubble);
    line.appendChild(info);

    row.appendChild(nickname);
    row.appendChild(line);

    box.appendChild(row);
}


/* 메시지 전송 */

async function sendMessage() {

    const input =
        document.getElementById("messageInput");

    const text =
        input.value.trim();

    if (!text) return;

    input.disabled = true;

    const { error } =
        await supabaseClient
            .from("messages")
            .insert({
                nickname: currentUser,
                message: text
            });

    input.disabled = false;

    if (error) {
        console.error(error);
        alert("메시지 전송에 실패했습니다.");
        return;
    }

    input.value = "";
    input.focus();
}


/* 엔터 전송 */

document
    .getElementById("messageInput")
    .addEventListener("keydown", function(e) {

        if (e.key === "Enter") {
            e.preventDefault();
            sendMessage();
        }

    });


/* 실시간 메시지 */

function subscribeMessages() {

    supabaseClient
        .channel("friendschat-messages")
        .on(
            "postgres_changes",
            {
                event: "INSERT",
                schema: "public",
                table: "messages"
            },
            payload => {

                const box =
                    document.getElementById("messages");

                const empty =
                    box.querySelector(".empty");

                if (empty) {
                    box.innerHTML = "";
                }

                addMessage(payload.new);

                scrollToBottom();
            }
        )
        .subscribe();
}


/* 아래로 이동 */

function scrollToBottom() {

    const box =
        document.getElementById("messages");

    setTimeout(() => {
        box.scrollTop = box.scrollHeight;
    }, 50);
}
</script>

</body>
</html>
