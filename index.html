<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>FriendsChat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "Noto Sans KR", sans-serif;
    background: #f5f7fa;
    color: #222;
}

button,
input {
    font: inherit;
}

button {
    border: 0;
    cursor: pointer;
}

/* =========================
   LOGIN
========================= */

#loginScreen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px;
    background: linear-gradient(135deg, #dff8c8, #f5fff0);
}

.loginBox {
    width: 100%;
    max-width: 390px;
    background: white;
    border-radius: 24px;
    padding: 32px 25px;
    box-shadow: 0 12px 35px rgba(0,0,0,.1);
}

.logo {
    text-align: center;
    font-size: 34px;
    font-weight: 800;
    margin-bottom: 8px;
}

.logo span {
    color: #67b52f;
}

.loginSub {
    text-align: center;
    color: #777;
    margin-bottom: 28px;
}

.loginBox input {
    width: 100%;
    height: 52px;
    border: 1px solid #ddd;
    border-radius: 14px;
    padding: 0 15px;
    margin-bottom: 12px;
    outline: none;
}

.loginBox input:focus {
    border-color: #78c83f;
}

.loginBtn {
    width: 100%;
    height: 52px;
    border-radius: 14px;
    background: #78c83f;
    color: white;
    font-weight: 700;
}

.loginBtn:active {
    transform: scale(.98);
}

.loginError {
    min-height: 22px;
    color: #e53935;
    text-align: center;
    font-size: 14px;
    margin-top: 12px;
}

/* =========================
   APP
========================= */

#app {
    display: none;
    height: 100vh;
    overflow: hidden;
}

.appLayout {
    height: 100%;
    display: flex;
}

/* =========================
   SIDEBAR
========================= */

.sidebar {
    width: 310px;
    background: white;
    border-right: 1px solid #e9e9e9;
    display: flex;
    flex-direction: column;
}

.sideTop {
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    border-bottom: 1px solid #eee;
}

.sideTitle {
    font-size: 23px;
    font-weight: 800;
}

.profileMini {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 18px;
    border-bottom: 1px solid #eee;
}

.avatar {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: #dff5c8;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 700;
    flex-shrink: 0;
}

.profileName {
    font-weight: 700;
}

.profileStatus {
    color: #777;
    font-size: 13px;
    margin-top: 3px;
}

.friendTitle {
    padding: 17px 18px 8px;
    color: #888;
    font-size: 13px;
    font-weight: 700;
}

.friendList {
    overflow-y: auto;
    flex: 1;
}

.friend {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 18px;
    cursor: pointer;
}

.friend:hover {
    background: #f5f7f5;
}

.friend.active {
    background: #eaf8df;
}

.friendInfo {
    flex: 1;
    min-width: 0;
}

.friendName {
    font-weight: 700;
}

.friendLast {
    font-size: 13px;
    color: #999;
    margin-top: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.onlineDot {
    width: 10px;
    height: 10px;
    background: #4caf50;
    border-radius: 50%;
    border: 2px solid white;
}

.offlineDot {
    width: 10px;
    height: 10px;
    background: #bbb;
    border-radius: 50%;
    border: 2px solid white;
}

.logoutBtn {
    margin: 14px;
    height: 44px;
    border-radius: 12px;
    background: #f1f1f1;
    color: #555;
}

/* =========================
   CHAT
========================= */

.chat {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.chatHeader {
    height: 72px;
    background: white;
    border-bottom: 1px solid #eee;
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 12px;
}

.mobileBack {
    display: none;
    background: transparent;
    font-size: 25px;
}

.chatUserName {
    font-weight: 800;
    font-size: 18px;
}

.chatUserStatus {
    color: #888;
    font-size: 12px;
    margin-top: 3px;
}

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    background: #edf1f4;
}

.emptyChat {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #999;
    text-align: center;
}

.messageRow {
    display: flex;
    margin-bottom: 10px;
}

.messageRow.mine {
    justify-content: flex-end;
}

.messageRow.other {
    justify-content: flex-start;
}

.messageBubble {
    max-width: min(72%, 520px);
}

.sender {
    font-size: 12px;
    color: #777;
    margin-bottom: 4px;
}

.mine .sender {
    text-align: right;
}

.bubble {
    display: inline-block;
    padding: 10px 13px;
    border-radius: 17px;
    background: white;
    line-height: 1.4;
    word-break: break-word;
    box-shadow: 0 1px 2px rgba(0,0,0,.05);
}

.mine .bubble {
    background: #8ed653;
    color: white;
}

.messageMeta {
    font-size: 10px;
    color: #888;
    margin-top: 3px;
}

.mine .messageMeta {
    text-align: right;
}

/* =========================
   INPUT
========================= */

.inputArea {
    background: white;
    padding: 12px;
    border-top: 1px solid #eee;
    display: flex;
    gap: 8px;
    align-items: center;
}

.emojiBtn,
.attachBtn {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: #f3f3f3;
    font-size: 20px;
}

.messageInput {
    flex: 1;
    min-width: 0;
    height: 42px;
    border: 1px solid #ddd;
    border-radius: 15px;
    padding: 0 13px;
    outline: none;
}

.sendBtn {
    width: 60px;
    height: 42px;
    border-radius: 13px;
    background: #78c83f;
    color: white;
    font-weight: 700;
}

.sendBtn:disabled {
    background: #ccc;
}

/* =========================
   EMOJI
========================= */

.emojiPanel {
    display: none;
    position: absolute;
    bottom: 70px;
    left: 10px;
    background: white;
    width: 280px;
    padding: 12px;
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,.18);
    z-index: 10;
}

.emojiGrid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
}

.emojiGrid button {
    background: transparent;
    font-size: 23px;
    padding: 5px;
}

/* =========================
   FILE
========================= */

#fileInput {
    display: none;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 700px) {

    .sidebar {
        width: 100%;
    }

    .chat {
        display: none;
        width: 100%;
    }

    .appLayout.chatOpen .sidebar {
        display: none;
    }

    .appLayout.chatOpen .chat {
        display: flex;
    }

    .mobileBack {
        display: block;
    }

    .messageBubble {
        max-width: 82%;
    }
}
</style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<section id="loginScreen">

    <div class="loginBox">

        <div class="logo">
            Friends<span>Chat</span>
        </div>

        <div class="loginSub">
            친구들과 편하게 이야기해보세요
        </div>

        <input
            id="username"
            type="text"
            placeholder="아이디"
            autocomplete="username"
        >

        <input
            id="password"
            type="password"
            placeholder="비밀번호"
            autocomplete="current-password"
        >

        <button class="loginBtn" onclick="login()">
            로그인
        </button>

        <div id="loginError" class="loginError"></div>

    </div>

</section>


<!-- =========================
     APP
========================= -->

<section id="app">

    <div id="appLayout" class="appLayout">

        <!-- SIDEBAR -->

        <aside class="sidebar">

            <div class="sideTop">
                <div class="sideTitle">친구</div>
            </div>

            <div class="profileMini">

                <div id="myAvatar" class="avatar">
                    🙂
                </div>

                <div>
                    <div id="myName" class="profileName">
                        -
                    </div>

                    <div class="profileStatus">
                        내 프로필
                    </div>
                </div>

            </div>

            <div class="friendTitle">
                친구 목록
            </div>

            <div id="friendList" class="friendList"></div>

            <button class="logoutBtn" onclick="logout()">
                로그아웃
            </button>

        </aside>


        <!-- CHAT -->

        <main class="chat">

            <header class="chatHeader">

                <button
                    class="mobileBack"
                    onclick="closeChat()"
                >
                    ‹
                </button>

                <div id="chatAvatar" class="avatar">
                    💬
                </div>

                <div>

                    <div id="chatUserName" class="chatUserName">
                        친구를 선택하세요
                    </div>

                    <div id="chatUserStatus" class="chatUserStatus">
                    </div>

                </div>

            </header>


            <div id="messages" class="messages">

                <div class="emptyChat">
                    왼쪽에서 친구를 선택하세요.
                </div>

            </div>


            <div
                class="inputArea"
                style="position:relative;"
            >

                <div
                    id="emojiPanel"
                    class="emojiPanel"
                >
                    <div
                        id="emojiGrid"
                        class="emojiGrid"
                    ></div>
                </div>

                <button
                    class="emojiBtn"
                    onclick="toggleEmoji()"
                >
                    😀
                </button>

                <button
                    class="attachBtn"
                    onclick="document.getElementById('fileInput').click()"
                >
                    📎
                </button>

                <input
                    id="fileInput"
                    type="file"
                    onchange="fileSelected(event)"
                >

                <input
                    id="messageInput"
                    class="messageInput"
                    type="text"
                    placeholder="메시지를 입력하세요"
                    disabled
                    onkeydown="handleEnter(event)"
                >

                <button
                    id="sendBtn"
                    class="sendBtn"
                    onclick="sendMessage()"
                    disabled
                >
                    전송
                </button>

            </div>

        </main>

    </div>

</section>


<script>

/* ==================================================
   SUPABASE
================================================== */

const SUPABASE_URL =
    "https://qtprsnwbeqwuzqpnlxot.supabase.co";

/*
   ↓↓↓ 기존에 사용하던 anon key를 여기에 넣어줘.
*/
const SUPABASE_ANON_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF0cHJzbndiZXF3dXpxcG5seG90Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNTIwNjksImV4cCI6MjEwMzkyODA2OX0.O39oJfWYgvI2O40EcI4cgw3yM1HNrvz0n--CXiKMThM";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* ==================================================
   STATE
================================================== */

let currentUser = null;
let currentFriend = null;
let currentRoom = null;
let realtimeChannel = null;


/* ==================================================
   DOM
================================================== */

const loginScreen =
    document.getElementById("loginScreen");

const app =
    document.getElementById("app");

const appLayout =
    document.getElementById("appLayout");

const usernameInput =
    document.getElementById("username");

const passwordInput =
    document.getElementById("password");

const loginError =
    document.getElementById("loginError");

const friendList =
    document.getElementById("friendList");

const messagesBox =
    document.getElementById("messages");

const messageInput =
    document.getElementById("messageInput");

const sendBtn =
    document.getElementById("sendBtn");

const chatUserName =
    document.getElementById("chatUserName");

const chatUserStatus =
    document.getElementById("chatUserStatus");

const myName =
    document.getElementById("myName");

const myAvatar =
    document.getElementById("myAvatar");

const chatAvatar =
    document.getElementById("chatAvatar");


/* ==================================================
   EMOJI
================================================== */

const emojis = [
    "😀","😃","😄","😁","😆","😅","😂",
    "🤣","😊","🙂","🙃","😉","😌","😍",
    "🥰","😘","😎","🤩","🥳","😋","😜",
    "🤔","🤗","😮","😭","😢","😡","😱",
    "👍","👎","👏","🙏","❤️","💚","💙",
    "💜","🔥","✨","🎉","🎂","🤣","ㅋㅋ",
    "🙌","💯","😴","🤪","😇","🥹"
];

function makeEmojiPanel() {

    const grid =
        document.getElementById("emojiGrid");

    grid.innerHTML = "";

    emojis.forEach(emoji => {

        const button =
            document.createElement("button");

        button.textContent = emoji;

        button.onclick = () => {

            messageInput.value += emoji;

            messageInput.focus();

        };

        grid.appendChild(button);

    });
}

makeEmojiPanel();


function toggleEmoji() {

    const panel =
        document.getElementById("emojiPanel");

    panel.style.display =
        panel.style.display === "block"
        ? "none"
        : "block";
}


/* ==================================================
   LOGIN
================================================== */

async function login() {

    const username =
        usernameInput.value.trim();

    const password =
        passwordInput.value;

    loginError.textContent = "";

    if (!username || !password) {

        loginError.textContent =
            "아이디와 비밀번호를 입력하세요.";

        return;
    }

    const {
        data,
        error
    } = await supabaseClient
        .from("chat_users")
        .select("username")
        .eq("username", username)
        .eq("password", password)
        .maybeSingle();

    if (error) {

        console.error(error);

        loginError.textContent =
            "로그인 오류가 발생했습니다.";

        return;
    }

    if (!data) {

        loginError.textContent =
            "아이디 또는 비밀번호가 틀렸습니다.";

        return;
    }

    currentUser = data.username;

    localStorage.setItem(
        "friendschat_user",
        currentUser
    );

    await setOnline();

    loginScreen.style.display = "none";
    app.style.display = "block";

    myName.textContent = currentUser;

    myAvatar.textContent =
        currentUser.charAt(0);

    await loadFriends();

}


/* ==================================================
   AUTO LOGIN
================================================== */

async function checkAutoLogin() {

    const saved =
        localStorage.getItem(
            "friendschat_user"
        );

    if (!saved) return;

    const {
        data
    } = await supabaseClient
        .from("chat_users")
        .select("username")
        .eq("username", saved)
        .maybeSingle();

    if (!data) {

        localStorage.removeItem(
            "friendschat_user"
        );

        return;
    }

    currentUser = data.username;

    await setOnline();

    loginScreen.style.display = "none";
    app.style.display = "block";

    myName.textContent = currentUser;

    myAvatar.textContent =
        currentUser.charAt(0);

    await loadFriends();
}

checkAutoLogin();


/* ==================================================
   ONLINE
================================================== */

async function setOnline() {

    if (!currentUser) return;

    await supabaseClient
        .from("profiles")
        .update({
            status: "online",
            last_seen: new Date().toISOString()
        })
        .eq("username", currentUser);
}


async function setOffline() {

    if (!currentUser) return;

    await supabaseClient
        .from("profiles")
        .update({
            status: "offline",
            last_seen: new Date().toISOString()
        })
        .eq("username", currentUser);
}


window.addEventListener(
    "beforeunload",
    () => {
        setOffline();
    }
);


/* ==================================================
   FRIENDS
================================================== */

async function loadFriends() {

    const {
        data,
        error
    } = await supabaseClient
        .from("profiles")
        .select("*")
        .neq("username", currentUser)
        .order("display_name");

    if (error) {

        console.error(error);

        return;
    }

    friendList.innerHTML = "";

    if (!data || data.length === 0) {

        friendList.innerHTML =
            '<div style="padding:20px;color:#999;">친구가 없습니다.</div>';

        return;
    }

    data.forEach(friend => {

        const item =
            document.createElement("div");

        item.className = "friend";

        item.dataset.username =
            friend.username;

        item.innerHTML = `

            <div class="avatar">
                ${escapeHtml(
                    friend.display_name.charAt(0)
                )}
            </div>

            <div class="friendInfo">

                <div class="friendName">
                    ${escapeHtml(friend.display_name)}
                </div>

                <div class="friendLast">
                    ${friend.status === "online"
                        ? "온라인"
                        : "오프라인"}
                </div>

            </div>

            <div class="${
                friend.status === "online"
                ? "onlineDot"
                : "offlineDot"
            }"></div>
        `;

        item.onclick = () =>
            openChat(friend);

        friendList.appendChild(item);

    });
}


/* ==================================================
   FIND ROOM
================================================== */

async function getRoom(user1, user2) {

    const keys = [
        `${user1}_${user2}`,
        `${user2}_${user1}`
    ];

    const {
        data,
        error
    } = await supabaseClient
        .from("chat_rooms")
        .select("*")
        .in("room_key", keys)
        .eq("is_group", false)
        .limit(1)
        .maybeSingle();

    if (error) {

        console.error(
            "채팅방 찾기 오류:",
            error
        );

        return null;
    }

    return data;
}


/* ==================================================
   OPEN CHAT
================================================== */

async function openChat(friend) {

    currentFriend = friend;

    document
        .querySelectorAll(".friend")
        .forEach(el => {

            el.classList.toggle(
                "active",
                el.dataset.username ===
                friend.username
            );

        });

    chatUserName.textContent =
        friend.display_name;

    chatAvatar.textContent =
        friend.display_name.charAt(0);

    chatUserStatus.textContent =
        friend.status === "online"
        ? "온라인"
        : "오프라인";

    currentRoom =
        await getRoom(
            currentUser,
            friend.username
        );

    if (!currentRoom) {

        messagesBox.innerHTML = `
            <div class="emptyChat">
                채팅방을 찾을 수 없습니다.
            </div>
        `;

        return;
    }

    messageInput.disabled = false;
    sendBtn.disabled = false;

    appLayout.classList.add("chatOpen");

    await loadMessages();

    subscribeMessages();

    messageInput.focus();
}


/* ==================================================
   LOAD MESSAGES
================================================== */

async function loadMessages() {

    if (!currentRoom) return;

    const {
        data,
        error
    } = await supabaseClient
        .from("messages")
        .select("*")
        .eq("room_id", currentRoom.id)
        .order("created_at", {
            ascending: true
        });

    if (error) {

        console.error(
            "메시지 로딩 오류:",
            error
        );

        messagesBox.innerHTML = `
            <div class="emptyChat">
                메시지를 불러오지 못했습니다.
            </div>
        `;

        return;
    }

    messagesBox.innerHTML = "";

    if (!data || data.length === 0) {

        messagesBox.innerHTML = `
            <div class="emptyChat">
                아직 메시지가 없습니다.<br>
                먼저 인사를 보내보세요 👋
            </div>
        `;

        return;
    }

    data.forEach(message => {

        renderMessage(message);

    });

    scrollMessages();

}


/* ==================================================
   RENDER MESSAGE
================================================== */

function renderMessage(message) {

    const sender =
        message.sender_username ||
        message.nickname ||
        "";

    const mine =
        sender === currentUser;

    const row =
        document.createElement("div");

    row.className =
        "messageRow " +
        (mine ? "mine" : "other");

    const bubbleWrap =
        document.createElement("div");

    bubbleWrap.className =
        "messageBubble";

    const time =
        message.created_at
        ? formatTime(message.created_at)
        : "";

    bubbleWrap.innerHTML = `

        <div class="sender">
            ${escapeHtml(sender)}
        </div>

        <div class="bubble">
            ${escapeHtml(message.message)}
        </div>

        <div class="messageMeta">
            ${time}
        </div>
    `;

    row.appendChild(bubbleWrap);

    messagesBox.appendChild(row);

}


/* ==================================================
   SEND
================================================== */

async function sendMessage() {

    if (!currentUser) return;

    if (!currentRoom) return;

    const text =
        messageInput.value.trim();

    if (!text) return;

    sendBtn.disabled = true;

    const {
        error
    } = await supabaseClient
        .from("messages")
        .insert({
            nickname: currentUser,
            sender_username: currentUser,
            message: text,
            room_id: currentRoom.id
        });

    if (error) {

        console.error(error);

        alert(
            "메시지 전송 실패\n" +
            error.message
        );

        sendBtn.disabled = false;

        return;
    }

    messageInput.value = "";

    sendBtn.disabled = false;

    messageInput.focus();
}


/* ==================================================
   ENTER
================================================== */

function handleEnter(event) {

    if (event.key === "Enter") {

        event.preventDefault();

        sendMessage();

    }
}


/* ==================================================
   REALTIME
================================================== */

function subscribeMessages() {

    if (!currentRoom) return;

    if (realtimeChannel) {

        supabaseClient
            .removeChannel(
                realtimeChannel
            );

    }

    realtimeChannel =
        supabaseClient
            .channel(
                "room-" +
                currentRoom.id +
                "-" +
                Date.now()
            )
            .on(
                "postgres_changes",
                {
                    event: "INSERT",
                    schema: "public",
                    table: "messages",
                    filter:
                        "room_id=eq." +
                        currentRoom.id
                },
                payload => {

                    renderMessage(
                        payload.new
                    );

                    scrollMessages();

                }
            )
            .subscribe();
}


/* ==================================================
   CLOSE CHAT
================================================== */

function closeChat() {

    appLayout.classList.remove(
        "chatOpen"
    );

    currentFriend = null;
    currentRoom = null;

    messageInput.value = "";

    messageInput.disabled = true;
    sendBtn.disabled = true;

    if (realtimeChannel) {

        supabaseClient
            .removeChannel(
                realtimeChannel
            );

        realtimeChannel = null;
    }

}


/* ==================================================
   FILE
================================================== */

function fileSelected(event) {

    const file =
        event.target.files[0];

    if (!file) return;

    alert(
        "파일 선택 완료: " +
        file.name +
        "\n\n파일 업로드 기능은 Supabase Storage 연결 후 활성화됩니다."
    );

    event.target.value = "";
}


/* ==================================================
   LOGOUT
================================================== */

async function logout() {

    await setOffline();

    if (realtimeChannel) {

        await supabaseClient
            .removeChannel(
                realtimeChannel
            );

    }

    localStorage.removeItem(
        "friendschat_user"
    );

    currentUser = null;
    currentFriend = null;
    currentRoom = null;

    app.style.display = "none";
    loginScreen.style.display = "flex";

    usernameInput.value = "";
    passwordInput.value = "";
    loginError.textContent = "";

    messageInput.disabled = true;
    sendBtn.disabled = true;

    appLayout.classList.remove(
        "chatOpen"
    );
}


/* ==================================================
   UTILS
================================================== */

function scrollMessages() {

    messagesBox.scrollTop =
        messagesBox.scrollHeight;
}


function formatTime(dateString) {

    const date =
        new Date(dateString);

    return date.toLocaleTimeString(
        "ko-KR",
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );
}


function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}
