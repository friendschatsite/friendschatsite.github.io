<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>친구채팅</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    font-family: Arial, "Noto Sans KR", sans-serif;
    background: #f7f7f7;
    color: #222;
}

.app {
    width: 100%;
    max-width: 600px;
    height: 100vh;
    margin: auto;
    background: #b2dff7;
    display: flex;
    flex-direction: column;
}

/* 상단 */
.header {
    height: 58px;
    background: white;
    display: flex;
    align-items: center;
    padding: 0 16px;
    border-bottom: 1px solid #ddd;
    flex-shrink: 0;
}

.header-title {
    font-size: 20px;
    font-weight: bold;
    flex: 1;
}

.header button {
    border: none;
    background: #f1f1f1;
    border-radius: 50%;
    width: 38px;
    height: 38px;
    font-size: 19px;
    cursor: pointer;
}

/* 채팅 영역 */
.chat {
    flex: 1;
    overflow-y: auto;
    padding: 18px 12px 12px;
}

/* 날짜 */
.date {
    text-align: center;
    margin: 5px 0 18px;
}

.date span {
    display: inline-block;
    background: rgba(255,255,255,0.75);
    padding: 6px 13px;
    border-radius: 20px;
    font-size: 12px;
    color: #555;
}

/* 메시지 */
.message {
    display: flex;
    margin-bottom: 10px;
    align-items: flex-end;
}

.message.me {
    justify-content: flex-end;
}

.profile {
    width: 36px;
    height: 36px;
    background: #fff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-right: 8px;
    font-size: 18px;
    flex-shrink: 0;
}

.message-content {
    max-width: 75%;
}

.name {
    font-size: 12px;
    margin-bottom: 4px;
    color: #555;
}

.bubble {
    display: inline-block;
    padding: 9px 12px;
    border-radius: 13px;
    background: white;
    font-size: 15px;
    line-height: 1.4;
    word-break: break-word;
}

.me .bubble {
    background: #ffe94a;
    border-radius: 13px 13px 3px 13px;
}

.message:not(.me) .bubble {
    border-radius: 13px 13px 13px 3px;
}

.time {
    font-size: 10px;
    color: #666;
    margin: 0 5px;
    white-space: nowrap;
}

/* 입력창 */
.input-area {
    min-height: 62px;
    background: white;
    border-top: 1px solid #ddd;
    display: flex;
    align-items: center;
    padding: 8px;
    gap: 7px;
    flex-shrink: 0;
}

.plus {
    width: 40px;
    height: 40px;
    border: none;
    background: #f2f2f2;
    border-radius: 10px;
    font-size: 23px;
}

.input {
    flex: 1;
    height: 42px;
    border: 1px solid #ddd;
    border-radius: 21px;
    padding: 0 15px;
    outline: none;
    font-size: 15px;
}

.input:focus {
    border-color: #aaa;
}

.send {
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 50%;
    background: #ffe94a;
    font-size: 19px;
    cursor: pointer;
}

.send:active {
    transform: scale(0.92);
}

/* 닉네임 설정 창 */
.modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal {
    width: 100%;
    max-width: 360px;
    background: white;
    border-radius: 20px;
    padding: 24px;
}

.modal h2 {
    margin: 0 0 8px;
}

.modal p {
    color: #777;
    font-size: 14px;
}

.modal input {
    width: 100%;
    height: 45px;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 0 12px;
    font-size: 15px;
    outline: none;
}

.modal-actions {
    display: flex;
    gap: 8px;
    margin-top: 15px;
}

.modal-actions button {
    flex: 1;
    height: 43px;
    border: none;
    border-radius: 10px;
    font-weight: bold;
}

.cancel {
    background: #eee;
}

.save {
    background: #ffe94a;
}

/* PC */
@media (min-width: 601px) {
    body {
        background: #e8e8e8;
    }

    .app {
        box-shadow: 0 0 25px rgba(0,0,0,0.12);
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- 상단 -->
    <div class="header">
        <div class="header-title">💬 친구채팅</div>
        <button onclick="openNickname()">⚙️</button>
    </div>

    <!-- 채팅 -->
    <div class="chat" id="chat">

        <div class="date">
            <span>오늘</span>
        </div>

        <div class="message">
            <div class="profile">🐰</div>

            <div class="message-content">
                <div class="name">친구1</div>
                <span class="bubble">안녕ㅋㅋ</span>
            </div>

            <div class="time">오후 11:40</div>
        </div>

        <div class="message">
            <div class="profile">🐱</div>

            <div class="message-content">
                <div class="name">친구2</div>
                <span class="bubble">야 여기 뭐임ㅋㅋ</span>
            </div>

            <div class="time">오후 11:41</div>
        </div>

        <div class="message me">
            <div class="time">오후 11:42</div>
            <span class="bubble">우리 채팅사이트임 ㅋㅋ</span>
        </div>

    </div>

    <!-- 입력 -->
    <div class="input-area">
        <button class="plus" onclick="plusMessage()">＋</button>

        <input
            id="messageInput"
            class="input"
            type="text"
            placeholder="메시지를 입력하세요"
            autocomplete="off"
        >

        <button class="send" onclick="sendMessage()">➤</button>
    </div>

</div>


<!-- 닉네임 설정 -->
<div class="modal-bg" id="nicknameModal">

    <div class="modal">

        <h2>내 닉네임</h2>

        <p>친구들에게 표시될 이름을 입력하세요.</p>

        <input
            id="nicknameInput"
            type="text"
            maxlength="20"
            placeholder="닉네임"
        >

        <div class="modal-actions">

            <button class="cancel" onclick="closeNickname()">
                취소
            </button>

            <button class="save" onclick="saveNickname()">
                저장
            </button>

        </div>

    </div>

</div>


<script>

let nickname = localStorage.getItem("nickname") || "나";

const input = document.getElementById("messageInput");
const chat = document.getElementById("chat");


/* 메시지 보내기 */
function sendMessage() {

    const text = input.value.trim();

    if (!text) return;

    const message = document.createElement("div");

    message.className = "message me";

    const time = new Date().toLocaleTimeString("ko-KR", {
        hour: "numeric",
        minute: "2-digit"
    });

    message.innerHTML = `
        <div class="time">${time}</div>
        <span class="bubble"></span>
    `;

    message.querySelector(".bubble").textContent = text;

    chat.appendChild(message);

    input.value = "";

    chat.scrollTop = chat.scrollHeight;
}


/* 엔터키 */
input.addEventListener("keydown", function(e) {

    if (e.key === "Enter") {
        sendMessage();
    }

});


/* 닉네임 창 */
function openNickname() {

    document.getElementById("nicknameModal").style.display = "flex";

    document.getElementById("nicknameInput").value = nickname;

    setTimeout(() => {
        document.getElementById("nicknameInput").focus();
    }, 100);
}


function closeNickname() {

    document.getElementById("nicknameModal").style.display = "none";

}


function saveNickname() {

    const value =
        document.getElementById("nicknameInput").value.trim();

    if (!value) {
        alert("닉네임을 입력하세요.");
        return;
    }

    nickname = value;

    localStorage.setItem("nickname", nickname);

    closeNickname();

}


/* + 버튼 */
function plusMessage() {

    alert("사진 / 파일 기능은 다음 버전에서 추가할 예정!");

}


/* 처음 열었을 때 아래로 */
chat.scrollTop = chat.scrollHeight;

</script>

</body>
</html>
